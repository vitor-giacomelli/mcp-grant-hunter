name: Create Missing TODO Issues

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — print what would be created without actually creating issues'
        required: false
        default: 'false'
        type: boolean
  push:
    branches:
      - main
      - 'copilot/**'
    paths:
      - 'TODO.md'
      - 'scripts/create_todo_issues.py'
      - 'scripts/close_resolved_issues.py'
      - 'scripts/validate_todo_issues.py'
      - '.github/workflows/create-todo-issues.yml'

permissions:
  issues: write
  contents: read

jobs:
  create-todo-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create required labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          create_label() {
            local name="$1" color="$2" desc="$3"
            gh label create "$name" \
              --color "$color" \
              --description "$desc" \
              --repo vitor-giacomelli/mcp-grant-hunter \
              --force 2>/dev/null && echo "Label ready: $name" || echo "Label skipped: $name"
          }
          create_label "enhancement"       "a2eeef" "New feature or request"
          create_label "sub-issue"         "7057ff" "Sub-issue of an epic"
          create_label "suggestion"        "d4c5f9" "Suggested improvement (optional)"
          create_label "area/testing"      "0052cc" "Testing infrastructure"
          create_label "area/ci"           "0052cc" "CI/CD pipeline"
          create_label "area/architecture" "0052cc" "Architecture and design concerns"
          create_label "area/api-contract" "1d76db" "API contract and schema concerns"
          create_label "area/security"     "e4e669" "Security-related concerns"
          create_label "area/docs"         "0075ca" "Documentation improvements"
          create_label "priority/P0"       "d93f0b" "Critical — must be addressed immediately"
          create_label "priority/P1"       "e4e669" "High priority"
          create_label "priority/P2"       "c2e0c6" "Medium priority"

      - name: Validate TODO/issue sync
        run: python scripts/validate_todo_issues.py

      - name: Close resolved issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/close_resolved_issues.py

      - name: Create missing TODO issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python scripts/create_todo_issues.py --dry-run
          else
            python scripts/create_todo_issues.py
          fi

